[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hdwig"
description = "Genomic coverage tracks in HDF5"
authors = [
    {name = "Calico f(DNA)", email = "drk@calicolabs.com"},
]
readme = "README.md"
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version"]

requires-python = ">=3.9"
dependencies = [
    "h5py>=3.8",
    "hdf5plugin>=4.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
bigwig = ["pybigwig>=0.3.18"]
dev = ["pybigwig>=0.3.18", "pytest>=7"]

[project.scripts]
hdwig = "hdwig.cli:main"

[project.urls]
Homepage = "https://github.com/calico/hdwig"

[tool.setuptools.dynamic]
version = {attr = "hdwig.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
